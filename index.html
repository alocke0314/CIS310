<style>

    --paper-alt:#E2DCC9;
    --ink:#23241D;
    --ink-soft:#54544A;
    --panel-dark:#1E2A28;
    --mint:#9FE6B3;
    --mint-dim:#6FA582;
    --gold:#B8863B;
    --gold-dim:#8f6a2c;
    --rust:#9B3F2C;
    --leaf:#4C6B44;

  }

  a{color:var(--leaf);}

  #app{display:flex; min-height:100vh;}

    padding:8px; font-size:11.5px; font-family:'IBM Plex Mono',monospace; cursor:pointer; border-radius:3px;
  }

  .hero{margin-bottom:34px;}
  .hero .eyebrow{font-family:'IBM Plex Mono',monospace; font-size:12px; color:var(--gold-dim); margin-bottom:6px;}
  .hero h1{font-size:38px; margin:0 0 10px; max-width:640px;}

/* ---------------------------- engine helpers (PGlite) ---------------------------- */

let mainDb = null;

async function initDb(){
  mainDb = new PGlite();
  await mainDb.exec(SCHEMA_SQL);
  await mainDb.exec(SEED_SQL);
}

function pgResToTable(res){
  if(!res || !res.fields || !res.fields.length) return {columns:[], values:[]};
  const columns = res.fields.map(f=>f.name);
  const values = res.rows.map(row => columns.map(c=>row[c]));
  return {columns, values};
}

// Runs student SQL read-only: wrapped in a transaction that always rolls back,
// so nothing they type (even DELETE/DROP) can damage the shared dataset.
async function runReadOnlyStudentSQL(sql){
  try{
    const results = await mainDb.exec(`BEGIN;\n${sql}\nROLLBACK;`);
    const last = results[results.length - 2]; // last statement before ROLLBACK
    return { ok:true, table: pgResToTable(last) };
  }catch(e){
    await mainDb.exec('ROLLBACK;').catch(()=>{});
    return { ok:false, error: e.message };
  }
}

async function runSolutionSQL(sql){
  const res = await mainDb.query(sql);
  return pgResToTable(res);
}

// DDL exercises run in an isolated, wiped-clean "scratch" schema each time,
// so table-creation mistakes never touch the shared dataset or other exercises.
async function runDdlCheck(ex, studentSql){
  await mainDb.exec('DROP SCHEMA IF EXISTS scratch CASCADE; CREATE SCHEMA scratch;');
  await mainDb.exec('SET search_path TO scratch;');
  try{
    if(ex.setupSql) await mainDb.exec(ex.setupSql);
    try{
      await mainDb.exec(studentSql);
    }catch(e){
      return { ok:false, error: e.message };
    }
    const results = [];
    for(const a of ex.assertions){
      results.push({ desc:a.desc, pass: await a.fn(mainDb) });
    }
    return { ok:true, results };
  } finally {
    await mainDb.exec('SET search_path TO public;').catch(()=>{});
  }
}

async function tableExists(d, name){
  const r = await d.query(`SELECT 1 FROM information_schema.tables WHERE table_schema='scratch' AND lower(table_name)=lower($1);`, [name]);
  return r.rows.length>0;
}
async function columnExists(d, table, col){
  const r = await d.query(`SELECT 1 FROM information_schema.columns WHERE table_schema='scratch' AND lower(table_name)=lower($1) AND lower(column_name)=lower($2);`, [table, col]);
  return r.rows.length>0;
}
async function rowCount(d, table){
  const r = await d.query(`SELECT COUNT(*)::int AS c FROM ${table};`);
  return r.rows[0].c;
}
async function insertFails(d, sql){
  try{ await d.exec(sql); return false; }
  catch(e){ return true; }
}

function normalizeVal(v){
  if(v===null || v===undefined) return 'NULL';
  const n = typeof v === 'number' ? v : (typeof v === 'string' && v.trim()!=='' && !isNaN(Number(v)) ? Number(v) : null);
  if(n !== null) return (Math.round(n*10000)/10000).toString();
  return String(v).trim();
}
function compareResults(studentRes, solutionRes){
  if(studentRes.values.length !== solutionRes.values.length) return false;
  if(solutionRes.values.length===0) return studentRes.values.length===0;
  if(studentRes.values[0].length !== solutionRes.values[0].length) return false;
  const norm = rows => rows.map(r => r.map(normalizeVal).join('\u0001')).sort();
  const a = norm(studentRes.values), b = norm(solutionRes.values);
  return a.length===b.length && a.every((v,i)=>v===b[i]);
}

// Checks raw (pre-normalized) values for decimal precision, so an answer that's
// numerically right but wasn't actually rounded (e.g. skipped ROUND()) is caught —
// compareResults alone can't tell, since it normalizes 155.0000000000000000 and
// 155.00 to the same value.
function exceedsMaxDecimals(table, maxDecimals){
  for(const row of table.values){
    for(const v of row){
      if(v===null || v===undefined) continue;
      const s = String(v);
      if(!/^-?\d+(\.\d+)?$/.test(s.trim())) continue; // skip non-numeric-looking values
      const dot = s.indexOf('.');
      const decimals = dot===-1 ? 0 : s.length - dot - 1;
      if(decimals > maxDecimals) return true;
    }
  }
  return false;
}

  exercises:[
    { id:'6.1', type:'quiz',
      prompt:`A table stores one row per adopter, with a single column called <code>pets_adopted</code> containing values like <code>"Biscuit, Rocky, Bruno"</code>. What normalization problem is this?`,
      options:['It violates First Normal Form (1NF) by storing a repeating group in one column','It violates Third Normal Form (3NF) via a transitive dependency','It is already fully normalized','It violates referential integrity'],
      correctIndex:0,
      solutionText:'1NF requires atomic values — each column should hold a single value, not a comma-separated list. The fix is a separate adoptions table with one row per animal-adopter pair, exactly like the PawPrint schema does.'
    },
    { id:'6.2', type:'quiz',
      prompt:`Imagine a single wide table with columns (<code>adoption_id</code>, <code>animal_id</code>, <code>animal_species</code>) where the primary key is the combination of <code>adoption_id</code> and <code>animal_id</code>. Since <code>animal_species</code> depends only on <code>animal_id</code> — not on the full key — what's this problem called?`,
      options:['A 1NF violation (non-atomic values)','A partial dependency (2NF violation)','A transitive dependency (3NF violation)','A missing foreign key'],
      correctIndex:1,
      solutionText:'2NF requires that every non-key column depend on the whole primary key. Here, animal_species only depends on part of the key (animal_id), which is exactly why PawPrint keeps species in the animals table, not repeated in adoptions.'
    },
    { id:'6.3', type:'quiz',
      prompt:`Suppose someone designed a single <code>animals_wide</code> table with these attributes: <code>animal_id</code> (primary key), <code>name</code>, <code>species</code>, <code>shelter_id</code>, and <code>shelter_city</code>.<br><br>
      Think about the functional dependencies here: <code>animal_id → shelter_id</code> (each animal belongs to one shelter), and separately <code>shelter_id → shelter_city</code> (each shelter is located in one city). Chaining those together gives <code>animal_id → shelter_id → shelter_city</code> — so <code>shelter_city</code> depends on the primary key only <i>indirectly</i>, through <code>shelter_id</code>, rather than depending on it directly. What's this pattern called?`,
      options:['A transitive dependency (3NF violation)','A candidate key issue','A 1NF violation','Denormalization is required here'],
      correctIndex:0,
      solutionText:'This is a transitive dependency: animal_id → shelter_id → shelter_city, where shelter_city depends on the non-key attribute shelter_id rather than directly on the primary key animal_id. 3NF fixes this by moving shelter_city out into its own shelters table (keyed on shelter_id) and linking with a foreign key — which is exactly how PawPrint is structured.'
    },
    { id:'6.4', type:'reflect',
      prompt:`Imagine one big spreadsheet with a row for every adoption, containing: <code>adopter_name</code>, <code>adopter_city</code>, <code>animal_name</code>, <code>animal_species</code>, <code>shelter_name</code>, <code>shelter_city</code>, and <code>fee</code>. In a few sentences, describe how you'd split this into normalized tables (like the ones PawPrint actually uses).`,
      solutionText:`A reasonable 3NF design:
• shelters (shelter_id, shelter_name, shelter_city, ...) — shelter facts live here once
• animals (animal_id, shelter_id, animal_name, animal_species, ...) — links to its shelter by id
• adopters (adopter_id, adopter_name, adopter_city, ...) — adopter facts live here once
• adoptions (adoption_id, animal_id, adopter_id, fee, adoption_date) — the linking/fact table

This removes repeated shelter and adopter details from every row, avoids update anomalies (e.g. a shelter changing cities), and matches the PawPrint schema you've been querying all along.`
    },
  ]
},
];

/* ---------------------------- state & persistence ---------------------------- */

let progress = {};
let currentModule = 'm1';
const drafts = {};

async function loadProgress(){
  try{
    const raw = localStorage.getItem('pawprint-progress');
    if(raw) progress = JSON.parse(raw);
  }catch(e){ progress = {}; }
}
async function saveProgress(){
  try{ localStorage.setItem('pawprint-progress', JSON.stringify(progress)); }
  catch(e){ /* non-fatal: progress just won't persist across sessions (e.g. private/incognito browsing) */ }
}
function markDone(exId){
  if(!progress[exId]){ progress[exId]=true; saveProgress(); }
}

function totalExercises(){ return MODULES.reduce((n,m)=>n+m.exercises.length,0); }
function doneExercises(){ return Object.keys(progress).filter(k=>progress[k]).length; }
function moduleDone(mod){ return mod.exercises.filter(e=>progress[e.id]).length; }

/* ---------------------------- rendering ---------------------------- */

function renderSidebar(engineState){
  const sb = document.getElementById('sidebar');
  const done = doneExercises(), total = totalExercises();
  const pct = total ? Math.round(done/total*100) : 0;
  sb.innerHTML = `
    <div class="brand">
      <div class="kicker">CIS 310 · PRACTICAL SQL PRACTICE</div>
      <h1>PawPrint DB Lab</h1>
      <div class="sub">Run real PostgreSQL. Get instant feedback.</div>
    </div>
    <div class="engine-badge">
      <span class="engine-dot ${engineState==='ready'?'':'loading'}"></span>
      ${engineState==='ready' ? 'Postgres engine ready' : 'Loading Postgres engine…'}
    </div>
    <div class="progress-wrap">
      <div class="progress-label"><span>OVERALL PROGRESS</span><span>${done}/${total}</span></div>
      <div class="progress-bar"><div class="progress-fill" style="width:${pct}%"></div></div>
    </div>
    <div>
      ${MODULES.map(m=>`
        <button class="nav-mod ${m.id===currentModule?'active':''}" data-mod="${m.id}" ${engineState==='ready'?'':'disabled'}>
          <span class="num">0${m.num}</span>${m.title.split(':')[0]}
          <span class="count">${moduleDone(m)}/${m.exercises.length} complete</span>
        </button>
      `).join('')}
    </div>
    <button class="reset-btn" id="resetBtn" ${engineState==='ready'?'':'disabled'}>Reset all progress</button>
  `;
  sb.querySelectorAll('.nav-mod').forEach(btn=>{
    btn.addEventListener('click', ()=>{ currentModule = btn.dataset.mod; renderAll('ready'); window.scrollTo({top:0}); });
  });
  const resetBtn = document.getElementById('resetBtn');
  if(resetBtn) resetBtn.addEventListener('click', async ()=>{
    if(confirm('Reset progress for all exercises?')){
      progress = {};
      await saveProgress();
      renderAll('ready');
    }
  });
}

function renderExercise(ex, mod){
  const isDone = !!progress[ex.id];
  const wrap = document.createElement('div');
  wrap.className = 'exercise' + (isDone ? ' done' : '');
  wrap.id = 'ex-'+ex.id.replace('.','-');

  const head = document.createElement('div');
  head.className = 'ex-head';
  head.innerHTML = `<span class="ex-id">EXERCISE ${ex.id}</span><span class="ex-status ${isDone?'done':''}">${isDone?'✓ complete':'not started'}</span>`;
  wrap.appendChild(head);

  const prompt = document.createElement('p');
  prompt.className = 'ex-prompt';
  prompt.innerHTML = ex.prompt;
  wrap.appendChild(prompt);

  const feedbackDiv = document.createElement('div');
  const resultDiv = document.createElement('div');

  function setDone(){
    markDone(ex.id);
    head.querySelector('.ex-status').textContent='✓ complete';
    head.querySelector('.ex-status').classList.add('done');
    wrap.classList.add('done');
    renderSidebar('ready');
  }

  if(ex.type==='query' || ex.type==='ddl'){
    const ta = document.createElement('textarea');
    ta.className = 'sql-input';
    ta.spellcheck = false;
    ta.placeholder = ex.type==='ddl' ? '-- write your SQL statement(s) here' : '-- write your SELECT query here';
    ta.value = drafts[ex.id] || '';
    ta.addEventListener('input', ()=>{ drafts[ex.id] = ta.value; });
    wrap.appendChild(ta);

    const btnRow = document.createElement('div');
    btnRow.className = 'btn-row';
    const runBtn = document.createElement('button');
    runBtn.className = 'btn';
    runBtn.textContent = ex.type==='ddl' ? 'Run & Check' : 'Run Query';
    const hintBtn = document.createElement('button');
    hintBtn.className = 'btn secondary';
    hintBtn.textContent = 'Hint';
    const solBtn = document.createElement('button');
    solBtn.className = 'btn secondary';
    solBtn.textContent = 'Show Solution';
    btnRow.appendChild(runBtn); btnRow.appendChild(hintBtn); btnRow.appendChild(solBtn);
    wrap.appendChild(btnRow);

    const hintBox = document.createElement('div');
    hintBox.className = 'hint-box'; hintBox.style.display='none';
    hintBox.innerHTML = ex.hint || '';
    wrap.appendChild(hintBox);
    hintBtn.addEventListener('click', ()=>{ hintBox.style.display = hintBox.style.display==='none' ? 'block' : 'none'; });

    const solBox = document.createElement('div');
    solBox.className = 'solution-box'; solBox.style.display='none';
    solBox.innerHTML = `<strong>Sample solution:</strong><pre>${escapeHtml(ex.solutionSql)}</pre>`;
    wrap.appendChild(solBox);
    solBtn.addEventListener('click', ()=>{ solBox.style.display = solBox.style.display==='none' ? 'block' : 'none'; });

    wrap.appendChild(feedbackDiv);
    wrap.appendChild(resultDiv);

    runBtn.addEventListener('click', async ()=>{
      feedbackDiv.replaceChildren();
      resultDiv.replaceChildren();
      const studentSql = ta.value.trim();
      if(!studentSql){ feedbackDiv.innerHTML = `<div class="feedback incorrect">Write a SQL statement first.</div>`; return; }
      runBtn.disabled = true; runBtn.textContent = 'Running…';

      if(ex.type==='query'){
        const outcome = await runReadOnlyStudentSQL(studentSql);
        if(!outcome.ok){
          feedbackDiv.innerHTML = `<div class="feedback error">SQL error: ${escapeHtml(outcome.error)}</div>`;
        } else {
          renderTable(resultDiv, outcome.table);
          const solTable = await runSolutionSQL(ex.solutionSql);
          const valuesMatch = compareResults(outcome.table, solTable);
          const failedPrecision = valuesMatch && ex.maxDecimals!==undefined && exceedsMaxDecimals(outcome.table, ex.maxDecimals);
          const correct = valuesMatch && !failedPrecision;
          if(correct){
            feedbackDiv.innerHTML = `<div class="feedback correct">✓ Correct! Your result matches the expected output.</div>`;
          } else if(failedPrecision){
            feedbackDiv.innerHTML = `<div class="feedback incorrect">Your value is right, but it isn't actually rounded to ${ex.maxDecimals} decimal places — use ROUND(..., ${ex.maxDecimals}).</div>`;
          } else {
            feedbackDiv.innerHTML = `<div class="feedback incorrect">Not quite — your query ran, but the result doesn't match what's expected yet. Check the columns, filters, and sort order.</div>`;
          }
          if(correct) setDone();
        }
      } else { // ddl
        const outcome = await runDdlCheck(ex, studentSql);
        if(!outcome.ok){
          feedbackDiv.innerHTML = `<div class="feedback error">SQL error while running your statement: ${escapeHtml(outcome.error)}</div>`;
        } else {
          const list = document.createElement('ul');
          list.className = 'assert-list';
          list.innerHTML = outcome.results.map(r=>`<li class="${r.pass?'pass':'fail'}">${escapeHtml(r.desc)}</li>`).join('');
          resultDiv.replaceChildren(list);
          const allPass = outcome.results.every(r=>r.pass);
          feedbackDiv.innerHTML = allPass
            ? `<div class="feedback correct">✓ All checks passed!</div>`
            : `<div class="feedback incorrect">Some checks didn't pass yet — see the list above.</div>`;
          if(allPass) setDone();
        }
      }
      runBtn.disabled = false; runBtn.textContent = ex.type==='ddl' ? 'Run & Check' : 'Run Query';
      feedbackDiv.scrollIntoView({ behavior:'smooth', block:'nearest' });
    });

  } else if(ex.type==='quiz'){
    const optWrap = document.createElement('div');
    optWrap.className = 'quiz-options';
    ex.options.forEach((opt,i)=>{
      const label = document.createElement('label');
      label.className = 'quiz-option';
      label.innerHTML = `<input type="radio" name="${ex.id}" value="${i}"> <span>${opt}</span>`;
      optWrap.appendChild(label);
    });
    wrap.appendChild(optWrap);
    optWrap.addEventListener('change', ()=>{
      optWrap.querySelectorAll('.quiz-option').forEach(l=>l.classList.remove('selected'));
      const checked = optWrap.querySelector('input:checked');
      if(checked) checked.closest('.quiz-option').classList.add('selected');
    });

    const btnRow = document.createElement('div');
    btnRow.className = 'btn-row';
    const submitBtn = document.createElement('button');
    submitBtn.className = 'btn'; submitBtn.textContent = 'Submit Answer';
    btnRow.appendChild(submitBtn);
    wrap.appendChild(btnRow);
    wrap.appendChild(feedbackDiv);

    submitBtn.addEventListener('click', ()=>{
      const checked = optWrap.querySelector('input:checked');
      if(!checked){ feedbackDiv.innerHTML = `<div class="feedback incorrect">Pick an answer first.</div>`; return; }
      const correct = Number(checked.value) === ex.correctIndex;
      feedbackDiv.innerHTML = `<div class="feedback ${correct?'correct':'incorrect'}">${correct?'✓ Correct.':'Not quite.'} ${ex.solutionText}</div>`;
      if(correct) setDone();
      feedbackDiv.scrollIntoView({ behavior:'smooth', block:'nearest' });
    });

  } else if(ex.type==='reflect'){
    const ta = document.createElement('textarea');
    ta.className = 'reflect-input';
    ta.placeholder = 'Jot down your own answer, then compare it to the model answer...';
    ta.value = drafts[ex.id] || '';
    ta.addEventListener('input', ()=>{ drafts[ex.id]=ta.value; });
    wrap.appendChild(ta);

    const btnRow = document.createElement('div');
    btnRow.className = 'btn-row';
    const revealBtn = document.createElement('button');
    revealBtn.className = 'btn secondary'; revealBtn.textContent = 'Reveal Model Answer';
    btnRow.appendChild(revealBtn);
    wrap.appendChild(btnRow);

    const solBox = document.createElement('div');
    solBox.className = 'solution-box'; solBox.style.display='none';
    solBox.innerHTML = `<pre>${escapeHtml(ex.solutionText)}</pre>`;
    wrap.appendChild(solBox);
    revealBtn.addEventListener('click', ()=>{
      solBox.style.display = solBox.style.display==='none' ? 'block' : 'none';
      setDone();
    });
  }

  return wrap;
}

function renderTable(container, res){
  if(!res.columns.length){ container.innerHTML = `<div class="feedback incorrect">Query ran, but returned no columns/rows.</div>`; return; }
  const wrap = document.createElement('div');
  wrap.className = 'result-table-wrap';
  const table = document.createElement('table');
  table.className = 'result-table';
  table.innerHTML = `<thead><tr>${res.columns.map(c=>`<th>${escapeHtml(c)}</th>`).join('')}</tr></thead>
    <tbody>${res.values.map(row=>`<tr>${row.map(v=>`<td>${v===null?'<i>NULL</i>':escapeHtml(String(v))}</td>`).join('')}</tr>`).join('')}</tbody>`;
  wrap.appendChild(table);
  container.innerHTML=''; container.appendChild(wrap);
}

function escapeHtml(s){
  return String(s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function renderSchemaRef(openByDefault){
  const details = document.createElement('details');
  details.className = 'schema-ref';
  if(openByDefault) details.open = true;

  const summary = document.createElement('summary');
  summary.innerHTML = `<span class="schema-ref-label">Table reference</span> — the tables and columns these exercises query`;
  details.appendChild(summary);

  const body = document.createElement('div');
  body.className = 'schema-ref-body';
  body.innerHTML = SCHEMA_REFERENCE.map(t => `
    <div class="schema-ref-table">
      <h4>${t.table}</h4>
      <table>${t.columns.map(([col,desc]) => `<tr><td>${escapeHtml(col)}</td><td>${escapeHtml(desc)}</td></tr>`).join('')}</table>
    </div>
  `).join('');
  details.appendChild(body);

  return details;
}

function renderMain(engineState){
  const main = document.getElementById('main');
  main.innerHTML = '';

  if(engineState!=='ready'){
    main.innerHTML = `<div style="padding:60px 0;font-family:'IBM Plex Mono',monospace;color:#54544A;">
      Booting a real PostgreSQL engine in your browser (WebAssembly)… this downloads once and usually takes a few seconds.
    </div>`;
    return;
  }

  const mod = MODULES.find(m=>m.id===currentModule);

  if(mod.num===1){
    const hero = document.createElement('div');
    hero.className = 'hero';
    hero.innerHTML = `
      <div class="eyebrow">A SANDBOX SHELTER DATABASE, BUILT FOR THIS COURSE</div>
      <h1>Practice on PawPrint, a fictional animal-shelter network</h1>
      <p>Every exercise below runs against <strong>real PostgreSQL</strong> — compiled to WebAssembly and running entirely in your browser (nothing is sent to a server) — using a small database of shelters, animals, adopters, and adoptions.</p>
    `;
    main.appendChild(hero);
  }

  const header = document.createElement('div');
  header.className = 'module-header';
  header.innerHTML = `<div class="tag">MODULE ${mod.num}</div><h2>${mod.title}</h2><p><strong>${mod.chapters}</strong> — ${mod.blurb}</p>`;
  main.appendChild(header);

  const hasQueryExercises = mod.exercises.some(e=>e.type==='query');
  if(hasQueryExercises){
    main.appendChild(renderSchemaRef(mod.num===2));
  }

  mod.exercises.forEach(ex=>{
    main.appendChild(renderExercise(ex, mod));
  });

  const nav = document.createElement('div');
  nav.className = 'btn-row';
  const idx = MODULES.findIndex(m=>m.id===mod.id);
  if(idx>0){
    const prevBtn = document.createElement('button');
    prevBtn.className='btn secondary'; prevBtn.textContent='← Previous module';
    prevBtn.addEventListener('click', ()=>{ currentModule = MODULES[idx-1].id; renderAll('ready'); window.scrollTo({top:0}); });
    nav.appendChild(prevBtn);
  }
  if(idx<MODULES.length-1){
    const nextBtn = document.createElement('button');
    nextBtn.className='btn'; nextBtn.textContent='Next module →';
    nextBtn.addEventListener('click', ()=>{ currentModule = MODULES[idx+1].id; renderAll('ready'); window.scrollTo({top:0}); });
    nav.appendChild(nextBtn);
  }
  main.appendChild(nav);
}

function renderFooter(){
  document.getElementById('footer').innerHTML = `Built for CIS 310 · Sample data is fictional. Runs on PGlite, a genuine WebAssembly build of PostgreSQL — the same SQL you'd write in pgAdmin, no server or install required. First load downloads the engine (a few MB) and may take a few seconds.`;
}

function renderAll(engineState){
  renderSidebar(engineState);
  renderMain(engineState);
  renderFooter();
}

/* ---------------------------- boot ---------------------------- */

async function boot(){
  await loadProgress();
  renderAll('loading');
  try{
    await initDb();
  }catch(e){
    document.getElementById('main').innerHTML = `<div style="padding:60px 0;color:#9B3F2C;font-family:'IBM Plex Mono',monospace;">Couldn't start the Postgres engine: ${escapeHtml(e.message)}. Try reloading, or opening this file from a web server instead of directly from disk.</div>`;
    return;
  }
  renderAll('ready');
}
boot();
</script>
